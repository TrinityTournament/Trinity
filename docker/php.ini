; TRINITY — ajustes de PHP para el contenedor
; Los errores van al log (docker compose logs web), nunca a la respuesta HTTP:
; la API siempre contesta JSON y no debe filtrar rutas ni consultas.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL
expose_php = Off
date.timezone = America/Montevideo
memory_limit = 128M
; La foto de perfil y el banner de torneo viajan en base64 (hasta ~2 MB de imagen).
post_max_size = 8M
upload_max_filesize = 8M
