# ══════════════════════════════════════════════════════════
#  TRINITY — VirtualHost para Docker (Apache 2.4 + mod_php)
#  Es la misma estructura que scripts/server/trinity.conf (la que se usa
#  en un servidor real); cambian solo los logs, que van a stdout/stderr
#  para que `docker compose logs web` los muestre.
#
#  Rutas dentro del contenedor (las pone el docker-compose.yml):
#    /var/www/trinity/Trinity-page   ← front-end (DocumentRoot)
#    /var/www/trinity/app            ← API PHP, hermana de Trinity-page
#    /var/www/trinity/vendor         ← dependencias de Composer (fuera del DocumentRoot)
#    /var/www/trinity/WhatsApp/assets← imágenes (solo las lee PHP, no se sirven)
# ══════════════════════════════════════════════════════════
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/trinity/Trinity-page

    <Directory /var/www/trinity/Trinity-page>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # API: vive afuera del DocumentRoot y se expone en /app/ sobre el mismo
    # origen (las cookies de sesión SameSite=Lax y fetch() siguen funcionando sin CORS).
    Alias /app /var/www/trinity/app
    <Directory /var/www/trinity/app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # config.php es el bootstrap que cargan los endpoints con require_once;
    # no es un endpoint y no tiene por qué poder pedirse por URL.
    <Files "config.php">
        Require all denied
    </Files>

    # Dentro de app/ solo se sirven endpoints .php. Los .js/.json que hay en
    # videogames/ son scripts de consola de Node y cachés de estadísticas: no los
    # pide el front y no tienen por qué poder descargarse.
    <Directory /var/www/trinity/app>
        <FilesMatch "\.(js|mjs|json|md|lock)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # src/ son clases internas, nunca endpoints.
    <Directory /var/www/trinity/app/src>
        Require all denied
    </Directory>

    # Nunca servir SQL (esquema, DCL, seed) ni archivos de configuración.
    <FilesMatch "\.(sql|md|lock|sh|env)$|^\.env|^composer\.json$|^package(-lock)?\.json$">
        Require all denied
    </FilesMatch>

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
