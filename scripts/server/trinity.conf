# ══════════════════════════════════════════════════════════
#  TRINITY — VirtualHost de ejemplo (Apache 2.4 + mod_php)
#
#  Se asume el proyecto clonado en /var/www/trinity, con sus carpetas
#  Trinity-page/ (front), app/ (API) y vendor/ (composer install) como hermanas.
#
#  Instalación (Ubuntu/Debian):
#    sudo a2enmod rewrite php8.3       # (mod_rewrite + PHP)
#    sudo cp scripts/server/trinity.conf /etc/apache2/sites-available/trinity.conf
#    # editar DocumentRoot/ServerName más abajo según tu entorno
#    sudo a2ensite trinity.conf
#    sudo systemctl reload apache2
#
#  En XAMPP/WAMP: copiar el bloque <VirtualHost> dentro del
#  httpd-vhosts.conf correspondiente y agregar la línea de
#  ServerName al archivo hosts del sistema operativo.
# ══════════════════════════════════════════════════════════

<VirtualHost *:80>
    ServerName trinity.local

    # IMPORTANTE: el DocumentRoot apunta a la RAÍZ de Trinity-page
    # (la carpeta que contiene index.html, pages/, components/, etc.),
    # no a una subcarpeta "public/". components/api.js detecta la
    # ruta base solo, así que si preferís servirlo desde una
    # subcarpeta (http://localhost/Trinity/) no hace falta tocar
    # nada del front-end.
    DocumentRoot /var/www/trinity/Trinity-page

    <Directory /var/www/trinity/Trinity-page>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── BACKEND (app/) ────────────────────────────────────────
    # app/ vive AFUERA del DocumentRoot, como hermana de
    # Trinity-page (no se sirve como estático desde la raíz del
    # sitio). Este Alias la expone en /app/ sobre el mismo origen,
    # así las cookies de sesión (SameSite=Lax) y el fetch() del
    # front-end siguen funcionando sin CORS.
    Alias /app /var/www/trinity/app

    <Directory /var/www/trinity/app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # config.php es el bootstrap que cargan los endpoints con require_once;
    # no es un endpoint y no tiene por qué poder pedirse por URL.
    <Files "config.php">
        Require all denied
    </Files>

    # Dentro de app/ solo se sirven endpoints .php. Los .js/.json que hay en
    # videogames/ son scripts de consola de Node y cachés de estadísticas: no los
    # pide el front y no tienen por qué poder descargarse.
    <Directory /var/www/trinity/app>
        <FilesMatch "\.(js|mjs|json|md|lock)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # src/ son clases internas (Trinity\...), no son endpoints:
    # nunca deben poder pedirse directo por URL.
    <Directory /var/www/trinity/app/src>
        Require all denied
    </Directory>

    # vendor/, database/, scripts/, docker/ y WhatsApp/ viven en la raíz del
    # proyecto, FUERA del DocumentRoot (Trinity-page/) y sin Alias: no se pueden
    # pedir por URL. Solo hay que cuidar que Trinity-page/ no sirva archivos
    # de configuración o SQL si alguna vez aparecen ahí:
    <FilesMatch "\.(sql|md|lock|sh|env)$|^\.env|^composer\.json$|^package(-lock)?\.json$">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/trinity_error.log
    CustomLog ${APACHE_LOG_DIR}/trinity_access.log combined
</VirtualHost>

# ── Alternativa: PHP-FPM en vez de mod_php ──────────────────
# Si el servidor corre PHP-FPM (más común en producción), agregar
# dentro del <VirtualHost> de arriba:
#
#   <FilesMatch \.php$>
#       SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
#   </FilesMatch>
